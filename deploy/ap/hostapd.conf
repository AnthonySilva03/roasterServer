# Roaster direct-AP — hostapd config (installed to /etc/hostapd/hostapd.conf).
#
# NetworkManager's built-in (wpa_supplicant) AP mode does NOT work on the Pi's
# brcmfmac chip — it beacons but the driver rejects the cipher/PMF setup
# ("nl80211: key setting validation failed") and clients can't associate.
# hostapd drives the same driver correctly, so the direct-AP uses hostapd.
#
# Change ssid/passphrase to match deploy/roaster-server.env (WIFI_SETUP_SSID /
# WIFI_SETUP_PASSWORD). country_code is required or the AP won't beacon.
interface=wlan0
driver=nl80211
ssid=Roaster
hw_mode=g
channel=6
country_code=US
ieee80211d=1
auth_algs=1
wpa=2
wpa_passphrase=roastme123
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
