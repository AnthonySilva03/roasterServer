# Installed to /etc/systemd/system/hostapd.service.d/10-roaster.conf
# Assigns wlan0's static AP gateway IP before hostapd starts the radio.
[Unit]
After=NetworkManager.service

[Service]
ExecStartPre=/sbin/ip link set wlan0 up
ExecStartPre=-/sbin/ip addr flush dev wlan0
ExecStartPre=/sbin/ip addr add 10.42.0.1/24 dev wlan0
