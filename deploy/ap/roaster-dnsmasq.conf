# Roaster direct-AP — dnsmasq (installed to /etc/dnsmasq.d/roaster.conf).
# Provides DHCP for clients on wlan0 and a captive-portal DNS hijack that
# resolves every name to the Pi (10.42.0.1) so the app opens on join.
interface=wlan0
bind-interfaces
dhcp-range=10.42.0.10,10.42.0.100,255.255.255.0,12h
dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1
address=/#/10.42.0.1
