# Installed to /etc/NetworkManager/dnsmasq-shared.d/roaster-captive.conf
#
# NetworkManager runs its own dnsmasq for "shared" (access-point) connections
# and reads extra config from /etc/NetworkManager/dnsmasq-shared.d/. This file
# resolves every hostname to the Pi (10.42.0.1) so any captive-portal probe a
# phone makes after joining the Roaster network hits the roaster app, which then
# redirects to the dashboard. Only applies to shared/AP connections; normal
# client Wi-Fi is unaffected.
address=/#/10.42.0.1
